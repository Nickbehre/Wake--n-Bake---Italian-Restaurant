name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # De build werkt zonder echte secrets (Supabase/Stripe/Resend vallen
      # terug op placeholders), zodat een kapotte build al hier faalt
      # in plaats van pas bij Vercel.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
